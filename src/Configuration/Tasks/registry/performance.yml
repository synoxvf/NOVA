title: Performance Settings
description: Applies system performance settings, including CPU priority, power plan, memory and file system configuration, and gaming-related settings.
actions:
  # CPU scheduler quantum policy
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\PriorityControl', value: 'Win32PrioritySeparation', type: REG_DWORD, data: '24'}

  # CPU reserve for low-priority tasks
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', value: 'SystemResponsiveness', type: REG_DWORD, data: '10'}

  # Network throttling for multimedia
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Multimedia\SystemProfile', value: 'NetworkThrottlingIndex', type: REG_DWORD, data: '4294967295'}  

  # Reducing the priority of background processes
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\MoUsoCoreWorker.exe\PerfOptions', value: 'CpuPriorityClass', type: REG_DWORD, data: '5'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\CompatTelRunner.exe\PerfOptions', value: 'CpuPriorityClass', type: REG_DWORD, data: '5'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\DeviceCensus.exe\PerfOptions', value: 'CpuPriorityClass', type: REG_DWORD, data: '5'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\backgroundTaskHost.exe\PerfOptions', value: 'CpuPriorityClass', type: REG_DWORD, data: '5'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\RuntimeBroker.exe\PerfOptions', value: 'CpuPriorityClass', type: REG_DWORD, data: '5'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\Windows NT\CurrentVersion\Image File Execution Options\spoolsv.exe\PerfOptions', value: 'CpuPriorityClass', type: REG_DWORD, data: '5'}

  # Configuring GameBar & DVR
  - !powerShell: {command: '.\GAMEBAR.ps1 -ConfigureGameBar', exeDir: true, wait: true, option: disable-gamebar}

  # Enabling HAGS
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\GraphicsDrivers', value: 'HwSchMode', type: REG_DWORD, data: '2'}

  # Import Power Plan "Ultimate Perfomance" & "NOVA"
  - !cmd: {command: 'powercfg /import "%windir%\NOVA.pow" 00000000-0000-0000-0000-000000000000'}
  - !powerShell: {command: '.\POWERPLAN.ps1', exeDir: true, wait: true}
  - !cmd: {command: 'powercfg /setactive 00000000-0000-0000-0000-000000000000'}

  # Disabling Hibirnation
  - !cmd: {command: 'powercfg /h off', option: 'disable-hibernation'}

  # Disabling Fault Tolerant Heap
  - !registryValue: {path: 'HKLM\SOFTWARE\Microsoft\FTH', value: 'Enabled', type: REG_DWORD, data: '0'}

  # Optimize NTFS
  - !run: {exe: 'fsutil', args: 'behavior set disablelastaccess 1'}
  - !run: {exe: 'fsutil', args: 'behavior set disabledeletenotify 0'}
  - !run: {exe: 'fsutil', args: 'behavior set disable8dot3 1'}
  - !run: {exe: 'fsutil', args: 'behavior set encryptpagingfile 0'}
  - !run: {exe: 'fsutil', args: 'behavior set disablecompression 1'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem', value: 'NtfsMemoryUsage', type: REG_DWORD, data: '2'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\FileSystem', value: 'NtfsDisableVolsnapHints', type: REG_DWORD, data: '1'}

  # NVMe APST Power & Interrupt Coalescing Optimization
  - !powerShell:
      command: |
        $nvme = @(Get-PhysicalDisk -ErrorAction SilentlyContinue | Where-Object { $_.BusType -eq 'NVMe' })
        if (-not $nvme.Count) {
          $nvme = @(Get-PnpDevice -ErrorAction SilentlyContinue | Where-Object {
            ($_.InstanceId -match 'NVME' -or $_.FriendlyName -match 'NVMe') -and $_.Status -eq 'OK'
          })
        }
        if (-not $nvme.Count) { exit 0 }
        $path = 'HKLM:\SYSTEM\CurrentControlSet\Services\stornvme\Parameters\Device'
        if (-not (Test-Path $path)) { New-Item -Path $path -Force | Out-Null }
        foreach ($pair in @(
          @{ Name = 'IdlePowerMode'; Value = '* 0' },
          @{ Name = 'DisableDSTThrottle'; Value = '* 1' },
          @{ Name = 'InterruptCoalescingTime'; Value = '* 0' },
          @{ Name = 'InterruptCoalescingEntry'; Value = '* 0' }
        )) {
          Remove-ItemProperty -Path $path -Name $pair.Name -ErrorAction SilentlyContinue
          New-ItemProperty -Path $path -Name $pair.Name -PropertyType MultiString -Value @($pair.Value) -Force | Out-Null
        }
        exit 0
      runas: currentUserElevated
      wait: true

  # Disabling background raw mouse throttling
  - !registryValue: {path: 'HKCU\Control Panel\Mouse', value: 'RawMouseThrottleDuration', type: REG_DWORD, data: '20'}

  # Disabling WDF global logging and Sleep Study collection
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Wdf', value: 'WdfGlobalLogsDisabled', type: REG_DWORD, data: '1'}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\Wdf', value: 'WdfGlobalSleepStudyDisabled', type: REG_DWORD, data: '1'}

  # BCD
  - !run: {exe: 'bcdedit', args: '/timeout 5'}
  - !run: {exe: 'bcdedit', args: '/set {current} bootmenupolicy legacy'}
  - !run: {exe: 'bcdedit', args: '/set x2apicpolicy enable'}
  - !run: {exe: 'bcdedit', args: '/set quietboot Yes'}
  - !run: {exe: 'bcdedit', args: '/set bootux Disabled'}

  # Disabling USB Power Managements & Device Idle States
  - !powerShell: {command: '.\USB.ps1', exeDir: true, runas: currentUserElevated, wait: true}
  - !registryValue: {path: 'HKLM\SYSTEM\CurrentControlSet\Control\usbflags', value: 'DisableHCS0Idle', type: REG_DWORD, data: '1'}

  # Enabling MSI Mode
  - !powerShell: {command: '.\MSI.ps1', exeDir: true}

  # NGEN 
  - !powerShell: {command: '.\NGEN.ps1', exeDir: true}

  # Disabling Store wake tasks
  - !scheduledTask: {path: '\Microsoft\Windows\InstallService\WakeUpAndContinueUpdates', operation: disable, ignoreErrors: true}
  - !scheduledTask: {path: '\Microsoft\Windows\InstallService\WakeUpAndScanForUpdates', operation: disable, ignoreErrors: true}
