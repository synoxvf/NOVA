title: APPX
description: Remove optional apps through the Windows package manager
actions:
  # Keep SystemApps, frameworks and StateRepository intact (NOVA issue #7).
  - !powerShell: {command: '.\APPX.ps1 -Group Bloatware', exeDir: true, runas: currentUserElevated, wait: true}

  # Xbox, Gaming Services, Game Bar and Game Assist are retained unless requested.
  - !powerShell: {command: '.\GAMEBAR.ps1 -UninstallXbox', exeDir: true, runas: currentUserElevated, wait: true, option: uninstall-xbox}
