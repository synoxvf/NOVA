title: APPX
description: Removal of certain Windows apps via native Windows API
actions:
  - !powerShell: {command: '.\APPX.ps1', exeDir: true, wait: true}

  # Disable Windows Backup
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\SettingSync', value: 'EnableWindowsBackup', type: REG_DWORD, data: '0'}
  - !registryValue: {path: 'HKLM\SOFTWARE\Policies\Microsoft\Windows\Backup', value: 'DisableBackup', type: REG_DWORD, data: '1'}

  # Other 
  - !appx: {name: '*StartMenuExperienceHost*', operation: clearCache}
  - !appx: {name: '*Windows.SecHealthUI*', operation: clearCache}
  - !appx: {name: '*Windows.Search*', operation: clearCache} 
  - !appx: {name: '*Client.CBS*', operation: clearCache}