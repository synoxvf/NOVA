title: Install Software
description: Installs selected browsers, media players, archivers, and game launchers with predefined settings and policies
actions:
  # DirectX
  - !writeStatus: {status: 'Installing DirectX'}
  - !software:
    name: 'directx'
    source: chocolatey
    package: 'directx'

  # Visual C++ Runtimes
  - !writeStatus: {status: 'Installing Visual C++ Runtimes', option: install-vcredist}
  - !download:
    option: install-vcredist
    url: 'https://github.com/abbodi1406/vcredist/releases/latest/download/VisualCppRedist_AIO_x86_x64.exe'
    destination: 'VisualCppRedist_AIO_x86_x64.exe'
    package: 'vcredist'
  - !run: {exe: 'VisualCppRedist_AIO_x86_x64.exe', args: '/ai /gm2', exeDir: true, wait: true, option: install-vcredist}

  # Browsers
  - !writeStatus: {status: 'Installing Brave', option: browser-brave}
  - !download:
    option: browser-brave
    url: 'https://github.com/brave/brave-browser/releases/latest/download/BraveBrowserStandaloneSetup.exe'
    destination: 'BraveBrowserStandaloneSetup.exe'
    package: 'brave'
  - !run: {exe: 'BraveBrowserStandaloneSetup.exe', args: '/silent /install', exeDir: true, option: browser-brave}
  - !powerShell: {command: '.\BROWSER.ps1 -Brave -uBlock', exeDir: true, wait: true, option: browser-brave}

  - !writeStatus: {status: 'Installing Firefox', option: browser-firefox}
  - !software:
    option: browser-firefox
    name: 'firefox'
    source: chocolatey
    package: 'firefox'
  - !powerShell: {command: '.\BROWSER.ps1 -Firefox', exeDir: true, wait: true, option: browser-firefox}

  - !writeStatus: {status: 'Installing Chrome', option: browser-chrome}
  - !software:
    option: browser-chrome
    name: 'googlechrome'
    source: chocolatey
    package: 'chrome'
  - !powerShell: {command: '.\BROWSER.ps1 -Chrome', exeDir: true, wait: true, option: browser-chrome}

  - !writeStatus: {status: 'Installing LibreWolf', option: browser-librewolf}
  - !software:
    name: 'librewolf'
    source: chocolatey
    option: browser-librewolf
    package: 'librewolf'

  - !writeStatus: {status: 'Installing Helium', option: browser-helium}
  - !download:
    option: browser-helium
    git: 'https://github.com/imputnet/helium-windows'
    regex: 'helium_.*_x64-installer\.exe'
    destination: 'HeliumInstaller.exe'
    package: 'helium'
  - !run: {exe: 'HeliumInstaller.exe', args: '/S /SYSTEM', exeDir: true, option: browser-helium}
  - !powerShell: {command: '.\BROWSER.ps1 -Helium', exeDir: true, wait: true, option: browser-helium}

  - !writeStatus: {status: 'Installing Zen Browser', option: browser-zen}
  - !download:
    option: browser-zen
    url: 'https://github.com/zen-browser/desktop/releases/latest/download/zen.installer.exe'
    destination: 'zen.installer.exe'
    package: 'zen'
  - !run: {exe: 'zen.installer.exe', args: '/S', exeDir: true, option: browser-zen}
  - !powerShell: {command: '.\BROWSER.ps1 -Zen', exeDir: true, wait: true, option: browser-zen}

  - !status: {status: 'Configuring Edge', option: '!uninstall-edge'}
  - !powerShell: {command: '.\BROWSER.ps1 -Edge -uBlock', exeDir: true, wait: true, option: '!uninstall-edge'}

  # Media players
  - !writeStatus: {status: 'Installing MPC-HC', option: mpc-hc}
  - !software:
    option: mpc-hc
    name: 'mpc-hc'
    source: chocolatey
    package: 'mpc-hc'

  - !writeStatus: {status: 'Installing VLC', option: vlc}
  - !software:
    option: vlc
    name: 'vlc'
    source: chocolatey
    package: 'vlc'

  # Archivers
  - !writeStatus: {status: 'Installing 7zip', option: 7-zip}
  - !software:
    option: 7-zip
    name: '7zip'
    source: chocolatey
    package: '7-zip'

  - !writeStatus: {status: 'Installing WinRAR', option: winrar}
  - !software:
    option: winrar
    name: 'winrar'
    source: chocolatey
    package: 'winrar'

  # Launchers 
  - !writeStatus: {status: 'Installing Steam', option: steam}
  - !software:
    option: steam
    name: 'steam'
    source: chocolatey
    package: 'steam'

  - !writeStatus: {status: 'Installing EA app', option: ea-app}
  - !software:
    option: ea-app
    name: 'ea-app'
    source: chocolatey
    package: 'ea-app'
  - !taskKill: {name: 'EA*', option: ea-app}

  - !writeStatus: {status: 'Installing Epic Games', option: epicgameslauncher}
  - !software:
    option: epicgameslauncher
    name: 'epicgameslauncher'
    source: chocolatey
    package: 'epic-games'

  - !writeStatus: {status: 'Installing Ubisoft', option: ubisoft-connect}
  - !software:
    option: ubisoft-connect
    name: 'ubisoft-connect'
    source: chocolatey
    package: 'ubisoft-connect'

  # Development Tools
  - !writeStatus: {status: 'Installing Visual Studio Code', option: vscode}
  - !software:
    option: vscode
    name: 'vscode'
    source: chocolatey
    package: 'vscode'

  - !writeStatus: {status: 'Installing Visual Studio 2026', option: vs2026}
  - !software:
    option: vs2026
    name: 'visualstudio2026community'
    source: chocolatey
    package: 'vs2026'

  - !writeStatus: {status: 'Installing Git', option: git}
  - !software:
    option: git
    name: 'git'
    source: chocolatey
    package: 'git'

  - !writeStatus: {status: 'Installing Notepad++', option: notepadplusplus}
  - !software:
    option: notepadplusplus
    name: 'notepadplusplus'
    source: chocolatey
    package: 'notepadplusplus'
