title: Windows Defender
description: Disables Windows Defender and LSA Protected Process Light components to ensure complete disablement.
option: disable-defender
actions:
  - !registryValue: {path: 'HKU\AME_UserHive_Default\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce', value: RunScript, data: 'powershell -EP Bypass -NoP -WindowStyle Hidden -Command "& \"$([Environment]::GetFolderPath(''Windows''))\Setup\Scripts\DEFENDER.ps1\""', type: REG_SZ}

  # Run the Windows Defender disabling script as TrustedInstaller
  - !powerShell:
    command: '.\Scripts\DEFENDER.ps1'
    runas: trustedInstaller
    wait: true
    exeDir: true