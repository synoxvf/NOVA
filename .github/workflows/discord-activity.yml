
name: NOVA GitHub Activity

on:
  issues:
    types: [opened, closed, reopened]

  issue_comment:
    types: [created]

  pull_request_target:
    types: [opened, closed, reopened]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Send Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_ACTIVITY_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          event_type = os.environ["GITHUB_EVENT_NAME"]
          action = event.get("action")

          if event_type == "issues":
              item = event["issue"]
              status = {
                  "opened": "Issue Opened",
                  "closed": "Issue Closed",
                  "reopened": "Issue Reopened",
              }[action]
              color = 0x57F287 if action == "opened" else 0xED4245
              url = item["html_url"]
              title = f"{status} #{item['number']}"
              description = item["title"]

          elif event_type == "pull_request_target":
              item = event["pull_request"]
              if action == "closed":
                  status = "PR Merged" if item["merged"] else "PR Closed"
              else:
                  status = f"PR {action.capitalize()}"

              color = 0x9B59B6 if item.get("merged") else 0x5865F2
              url = item["html_url"]
              title = f"{status} #{item['number']}"
              description = item["title"]

          elif event_type == "issue_comment":
              item = event["issue"]

              if "pull_request" in item:
                  exit(0)

              comment = event["comment"]
              title = f"New Comment on Issue #{item['number']}"
              description = (
                  f"**{item['title']}**\n\n"
                  f"{comment.get('body') or 'No text'}"
              )
              url = comment["html_url"]
              color = 0x3498DB

          else:
              title = "NOVA Integration Test"
              description = "GitHub Activity notifications are working!"
              url = "https://github.com/synoxvf/NOVA"
              color = 0x57F287

          payload = {
              "username": "NOVA GitHub",
              "embeds": [{
                  "title": title[:256],
                  "description": description[:3900],
                  "url": url,
                  "color": color
              }],
              "allowed_mentions": {"parse": []}
          }

          request = urllib.request.Request(
              os.environ["WEBHOOK_URL"],
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json"},
              method="POST"
          )

          with urllib.request.urlopen(request, timeout=20) as response:
              print("Discord response:", response.status)
          PY
