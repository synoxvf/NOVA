name: NOVA Discord Releases

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          import urllib.request
          import urllib.error

          webhook_url = os.environ.get("WEBHOOK_URL")
          if not webhook_url:
              print("Error: DISCORD_WEBHOOK_URL secret is not set in repository settings.")
              sys.exit(1)

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as f:
              event = json.load(f)

          release = event.get("release")
          sender = event.get("sender") or {}
          author_login = sender.get("login") or "synoxvf"
          author_avatar = sender.get("avatar_url") or "https://github.com/synoxvf.png"

          if release:
              tag = release.get("tag_name") or "v1.1.0"
              raw_body = release.get("body") or "New release available."
              url = release.get("html_url") or f"https://github.com/synoxvf/NOVA/releases/tag/{tag}"
          else:
              tag = "v1.1.0"
              raw_body = (
                  "- Fix Gaming Services and Xbox app installation failures (0x80073CF9 / 0x80070490)\n"
                  "- Rewrite AppX debloat engine via native PowerShell (APPX.ps1)\n"
                  "- Enforce Balanced scheme personality in NOVA power plan\n"
                  "- Neutralize Microsoft Update Health Tools and remediation tasks\n"
                  "- Add Visual C++ Runtimes All-in-One installer option\n"
                  "- Restore Volume Shadow Copy (VSS) and System Restore service baselines\n"
                  "- Configure BSOD crash dump generation to Small Memory Dump\n"
                  "- Minor performance, stability, and script improvements"
              )
              url = "https://github.com/synoxvf/NOVA/releases"

          display_tag = tag if tag.lower().startswith("v") else f"v{tag}"

          body_clean = raw_body.strip()
          if body_clean.startswith("```"):
              description = body_clean[:3800]
          else:
              lines = []
              for line in body_clean.splitlines():
                  s = line.strip()
                  if s.startswith("#") or s.startswith("---") or s.lower().startswith("changes:"):
                      continue
                  if s:
                      lines.append(line)
              description = "```\n" + "\n".join(lines).strip()[:3500] + "\n```"

          payload = {
              "username": "NOVA",
              "avatar_url": "https://raw.githubusercontent.com/synoxvf/NOVA/main/src/playbook.png",
              "embeds": [{
                  "author": {
                      "name": f"{author_login} released this",
                      "url": url,
                      "icon_url": author_avatar
                  },
                  "title": display_tag,
                  "url": url,
                  "description": description,
                  "color": 0xB68CFA
              }],
              "components": [
                  {
                      "type": 1,
                      "components": [
                          {
                              "type": 2,
                              "style": 5,
                              "label": "GitHub Releases",
                              "url": url
                          },
                          {
                              "type": 2,
                              "style": 5,
                              "label": "Changelog",
                              "url": f"https://github.com/synoxvf/NOVA/commits/{tag}"
                          }
                      ]
                  }
              ],
              "allowed_mentions": {"parse": []}
          }

          req = urllib.request.Request(
              webhook_url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "DiscordBot (https://github.com/synoxvf/NOVA, 1.0)"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(req, timeout=20) as response:
                  print("Discord status:", response.status)
          except urllib.error.HTTPError as e:
              print(f"Discord API error {e.code}: {e.read().decode('utf-8', errors='replace')}")
              sys.exit(1)
          PY
